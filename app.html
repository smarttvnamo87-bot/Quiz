<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GlobeQuiz — General Knowledge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f8ff;--card:rgba(255,255,255,.82);--text:#14213d;--muted:#6b7890;--blue:#1769ff;--blue2:#4b8cff;--green:#18a86b;--red:#e84c62;--line:#e6ebf4}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0%,#dce9ff 0,transparent 28%),radial-gradient(circle at 90% 10%,#e7ddff 0,transparent 25%),var(--bg);color:var(--text);min-height:100vh}
button{font:inherit}
.app{width:min(1050px,94%);margin:auto;padding:28px 0 50px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--blue)}
.badge{background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:13px;color:var(--muted);box-shadow:0 8px 25px #34517b12}
.card{background:var(--card);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:28px;box-shadow:0 24px 70px #284b8114;padding:30px}
.hero{text-align:center;padding:48px 25px}
.emoji{font-size:58px;margin-bottom:14px}.hero h1{font-size:clamp(34px,7vw,62px);letter-spacing:-3px;line-height:1.02;margin-bottom:13px}
.hero h1 span{color:var(--blue)}.hero p{color:var(--muted);max-width:600px;margin:auto;line-height:1.6}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 20px}
.cat{border:1px solid var(--line);background:#fff;padding:17px 10px;border-radius:17px;cursor:pointer;transition:.2s;text-align:center;color:var(--muted)}
.cat:hover,.cat.active{transform:translateY(-3px);border-color:#a9c5ff;box-shadow:0 10px 25px #1769ff15;color:var(--blue)}
.cat b{display:block;color:var(--text);font-size:14px;margin-top:5px}.cat.active b{color:var(--blue)}
.start{width:100%;border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px;border-radius:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 28px #1769ff35;transition:.2s}
.start:hover{transform:translateY(-2px);filter:saturate(1.1)}
.quiz{display:none}.quizhead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
.counter{font-weight:800}.scoremini{color:var(--blue);font-weight:800}
.progress{height:8px;background:#e9eef7;border-radius:99px;overflow:hidden;margin-bottom:35px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#7a9fff);transition:.4s}
.qtag{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);font-weight:900;margin-bottom:10px}
.question{font-size:clamp(25px,4vw,39px);line-height:1.18;letter-spacing:-1px;margin-bottom:25px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.option{padding:18px;border:2px solid var(--line);background:#fff;border-radius:17px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;color:var(--text)}
.option:hover{border-color:#9bbaff;transform:translateY(-2px)}.letter{min-width:34px;height:34px;border-radius:10px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}
.option.correct{border-color:var(--green);background:#eafaf3}.option.correct .letter{background:var(--green);color:#fff}
.option.wrong{border-color:var(--red);background:#fff0f2}.option.wrong .letter{background:var(--red);color:#fff}
.option:disabled{cursor:default}.next{margin-top:22px;width:100%;padding:15px;border:0;border-radius:15px;background:#14213d;color:#fff;font-weight:800;cursor:pointer;display:none}
.result{display:none;text-align:center;padding:45px 25px}.result .big{font-size:72px}.result h2{font-size:38px;margin:8px 0}.result p{color:var(--muted);margin-bottom:24px}.resultstats{display:flex;justify-content:center;gap:30px;margin:20px 0 30px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}
@media(max-width:650px){.categories{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.card{padding:22px}.hero{padding:35px 16px}.top{margin-bottom:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">Globe<span>Quiz</span> 🌎</div><div class="badge">General Knowledge</div></header>

<section id="home" class="card hero">
<div class="emoji">🧠</div>
<h1>How much do you<br><span>really know?</span></h1>
<p>Test yourself with questions from around the world. Pick a category, and we'll randomly build your quiz.</p>
<div class="categories" id="categories"></div>
<button class="start" onclick="startQuiz()">Start Random Quiz →</button>
</section>

<section id="quiz" class="card quiz">
<div class="quizhead"><div class="counter" id="counter">Question 1/10</div><div class="scoremini" id="scoremini">Score: 0</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="qtag" id="qtag">World</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<button class="next" id="next" onclick="nextQuestion()">Next Question →</button>
</section>

<section id="result" class="card result">
<div class="big" id="resultEmoji">🏆</div>
<h2 id="resultTitle">Amazing!</h2>
<p id="resultText"></p>
<div class="resultstats">
<div class="stat"><b id="finalScore">0</b><span>Correct</span></div>
<div class="stat"><b id="finalTotal">10</b><span>Total</span></div>
<div class="stat"><b id="finalPercent">0%</b><span>Accuracy</span></div>
</div>
<button class="start" onclick="backHome()">Play Again</button>
</section>
</div>

<script>
const bank=[
["World","Which is the largest ocean on Earth?",["Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean"],2],
["World","Which country is famous for the Eiffel Tower?",["Italy","France","Spain","Germany"],1],
["World","What is the capital city of Japan?",["Seoul","Beijing","Tokyo","Bangkok"],2],
["World","Which country has the Great Barrier Reef?",["Australia","Brazil","Mexico","South Africa"],0],
["World","Which is the largest continent by area?",["Africa","Asia","Europe","North America"],1],
["World","The Sahara is located mainly on which continent?",["Asia","Africa","Australia","Europe"],1],
["World","Which country is shaped like a boot?",["Greece","Italy","Portugal","Chile"],1],
["World","What is the capital of Canada?",["Toronto","Vancouver","Ottawa","Montreal"],2],
["World","Which famous city is known as the 'Big Apple'?",["London","New York City","Chicago","Los Angeles"],1],
["World","Which country is home to Machu Picchu?",["Peru","Chile","Bolivia","Ecuador"],0],

["Science","What planet is known as the Red Planet?",["Venus","Mars","Jupiter","Mercury"],1],
["Science","What gas do humans need to breathe?",["Carbon dioxide","Oxygen","Hydrogen","Helium"],1],
["Science","How many bones are in the typical adult human body?",["106","206","306","406"],1],
["Science","What is H2O commonly called?",["Salt","Oxygen","Water","Hydrogen"],2],
["Science","Which force keeps us on the ground?",["Magnetism","Gravity","Friction","Electricity"],1],
["Science","What is the closest star to Earth?",["Sirius","Polaris","The Sun","Proxima Centauri"],2],
["Science","Which organ pumps blood around the human body?",["Lungs","Brain","Heart","Liver"],2],
["Science","What do bees collect from flowers?",["Sand","Nectar","Leaves","Sap"],1],
["Science","Which natural satellite orbits Earth?",["Mars","The Moon","Venus","Titan"],1],
["Science","What is the process by which plants make food using sunlight?",["Digestion","Photosynthesis","Evaporation","Respiration"],1],

["History","Who was the first person to walk on the Moon?",["Buzz Aldrin","Neil Armstrong","Yuri Gagarin","Michael Collins"],1],
["History","Which ancient civilization built the pyramids at Giza?",["Romans","Ancient Egyptians","Vikings","Greeks"],1],
["History","The Titanic sank in which year?",["1905","1912","1920","1931"],1],
["History","Who is traditionally credited with reaching the Americas in 1492?",["Christopher Columbus","Marco Polo","Ferdinand Magellan","James Cook"],0],
["History","Which city was buried by Mount Vesuvius in AD 79?",["Pompeii","Athens","Carthage","Sparta"],0],
["History","The ancient Olympic Games began in which country?",["Italy","Greece","Egypt","Turkey"],1],
["History","Who was known as the 'Maid of Orléans'?",["Cleopatra","Joan of Arc","Marie Curie","Queen Victoria"],1],
["History","Which famous wall divided Berlin during the Cold War?",["Berlin Wall","Hadrian's Wall","Great Wall","Western Wall"],0],
["History","Who painted the Mona Lisa?",["Vincent van Gogh","Leonardo da Vinci","Pablo Picasso","Michelangelo"],1],
["History","Which empire built the Colosseum?",["Roman Empire","Mongol Empire","Ottoman Empire","Mali Empire"],0],

["Nature","What is the fastest land animal?",["Lion","Cheetah","Horse","Leopard"],1],
["Nature","What is the largest animal on Earth?",["Elephant","Blue whale","Giraffe","Great white shark"],1],
["Nature","Which animal is known for changing its color to blend in?",["Penguin","Chameleon","Kangaroo","Dolphin"],1],
["Nature","What is a baby frog called?",["Cub","Calf","Tadpole","Kitten"],2],
["Nature","Which bird is famous for being unable to fly and living in Antarctica?",["Eagle","Penguin","Swan","Parrot"],1],
["Nature","What type of animal is a Komodo dragon?",["Mammal","Bird","Reptile","Fish"],2],
["Nature","Which tree produces acorns?",["Oak","Pine","Palm","Maple"],0],
["Nature","How many legs does a spider have?",["6","8","10","12"],1],
["Nature","Which is the largest big cat species?",["Tiger","Lion","Cheetah","Jaguar"],0],
["Nature","What do pandas mainly eat?",["Bamboo","Grass seeds","Fish","Berries"],0],

["Technology","What does 'www' stand for?",["World Wide Web","World Web Window","Wide World Wire","Web World Wide"],0],
["Technology","Which company developed the Android operating system?",["Microsoft","Google","Nintendo","IBM"],1],
["Technology","What does CPU stand for?",["Central Processing Unit","Computer Personal Unit","Core Program Utility","Central Program User"],0],
["Technology","Which device is commonly used to move a cursor on a computer?",["Printer","Mouse","Speaker","Router"],1],
["Technology","What does GPS help determine?",["Blood type","Location","Temperature only","Screen size"],1],
["Technology","Which of these is a web browser?",["Chrome","Photoshop","Windows","Android"],0],
["Technology","What does AI commonly stand for?",["Automated Internet","Artificial Intelligence","Advanced Input","Active Interface"],1],
["Technology","Which company makes the iPhone?",["Samsung","Apple","Sony","Nokia"],1],
["Technology","What is a QR code designed to store?",["Digital information","Only music","Only passwords","Electricity"],0],
["Technology","Which unit is commonly used to measure digital storage?",["Liter","Byte","Meter","Newton"],1],

["Sports","How many players are on the field for one soccer team at a time?",["9","10","11","12"],2],
["Sports","Which sport uses a racket and a shuttlecock?",["Tennis","Badminton","Baseball","Hockey"],1],
["Sports","How many rings are on the Olympic symbol?",["4","5","6","7"],1],
["Sports","Which sport is played at Wimbledon?",["Football","Tennis","Golf","Cricket"],1],
["Sports","In basketball, how many points is a free throw worth?",["1","2","3","4"],0],
["Sports","Which country is strongly associated with sumo wrestling?",["Japan","Brazil","Canada","Egypt"],0],
["Sports","What color jersey is traditionally worn by the leader of the Tour de France?",["Green","Yellow","Blue","White"],1],
["Sports","How many holes are played in a standard round of golf?",["9","12","18","24"],2],
["Sports","Which sport uses a puck?",["Cricket","Ice hockey","Rugby","Volleyball"],1],
["Sports","What is the maximum score with one dart in standard darts?",["50","60","80","100"],1],

["Entertainment","Which fictional wizard attends Hogwarts?",["Frodo Baggins","Harry Potter","Luke Skywalker","Peter Pan"],1],
["Entertainment","Which movie features the song 'Let It Go'?",["Frozen","Moana","Toy Story","The Lion King"],0],
["Entertainment","What is the name of the cowboy in Toy Story?",["Buzz Lightyear","Woody","Andy","Sully"],1],
["Entertainment","Which superhero is also known as Bruce Wayne?",["Superman","Iron Man","Batman","Spider-Man"],2],
["Entertainment","Which film series features a character named Jack Sparrow?",["Harry Potter","Pirates of the Caribbean","The Matrix","Star Wars"],1],
["Entertainment","Which animated character lives in a pineapple under the sea?",["SpongeBob SquarePants","Mickey Mouse","Shrek","Tom"],0],
["Entertainment","What is the fictional land in The Lion, the Witch and the Wardrobe?",["Wakanda","Narnia","Middle-earth","Neverland"],1],
["Entertainment","Which superhero uses a shield with a star?",["Hulk","Captain America","Thor","Flash"],1],
["Entertainment","Which movie features the character Simba?",["Aladdin","The Lion King","Cars","Up"],1],
["Entertainment","Who is Mickey Mouse's famous partner?",["Daisy Duck","Minnie Mouse","Elsa","Wendy"],1]
];

const cats=[["🌍","World"],["🔬","Science"],["📜","History"],["🌿","Nature"],["💻","Technology"],["🏅","Sports"],["🎬","Entertainment"],["🎲","Mixed"]];
let selected="Mixed",questions=[],index=0,score=0,answered=false;
const categories=document.getElementById("categories");
cats.forEach(([icon,name])=>{
 const b=document.createElement("button"); b.className="cat"+(name==="Mixed"?" active":""); b.innerHTML=`${icon}<b>${name}</b>`;
 b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");selected=name};
 categories.appendChild(b);
});
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){
 let pool=selected==="Mixed"?bank:bank.filter(q=>q[0]===selected);
 questions=shuffle(pool).slice(0,10); index=0;score=0;
 document.getElementById("home").style.display="none";document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";
 render();
}
function render(){
 answered=false;const q=questions[index];
 document.getElementById("counter").textContent=`Question ${index+1}/${questions.length}`;
 document.getElementById("scoremini").textContent=`Score: ${score}`;
 document.getElementById("bar").style.width=`${index/questions.length*100}%`;
 document.getElementById("qtag").textContent=q[0];document.getElementById("question").textContent=q[1];
 const box=document.getElementById("options");box.innerHTML="";
 shuffle(q[2].map((text,i)=>({text,i}))).forEach((o,i)=>{
  const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span>${o.text}</span>`;
  b.onclick=()=>choose(b,o.i,q[3]);box.appendChild(b);
 });
 document.getElementById("next").style.display="none";
}
function choose(btn,choice,correct){
 if(answered)return;answered=true;
 const opts=[...document.querySelectorAll(".option")];
 opts.forEach(x=>x.disabled=true);
 const original=[...questions[index][2]];
 opts.forEach(x=>{const text=x.querySelector("span:last-child").textContent;if(original[correct]===text)x.classList.add("correct")});
 if(choice===correct){score++;btn.classList.add("correct")}else btn.classList.add("wrong");
 document.getElementById("scoremini").textContent=`Score: ${score}`;
 document.getElementById("next").style.display="block";
}
function nextQuestion(){if(index<questions.length-1){index++;render()}else showResult()}
function showResult(){
 document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";
 const pct=Math.round(score/questions.length*100);
 document.getElementById("finalScore").textContent=score;document.getElementById("finalTotal").textContent=questions.length;document.getElementById("finalPercent").textContent=pct+"%";
 let title,emoji;
 if(pct===100){title="Perfect Score!";emoji="🏆"}else if(pct>=80){title="Excellent!";emoji="🔥"}else if(pct>=60){title="Great Job!";emoji="😎"}else if(pct>=40){title="Nice Try!";emoji="💪"}else{title="Keep Learning!";emoji="🧠"}
 document.getElementById("resultTitle").textContent=title;document.getElementById("resultEmoji").textContent=emoji;
 document.getElementById("resultText").textContent=`You got ${score} out of ${questions.length} questions correct in ${selected}.`;
}
function backHome(){document.getElementById("result").style.display="none";document.getElementById("home").style.display="block"}
</script>
</body>
</html>
